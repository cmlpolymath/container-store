[project]
name = "ml-unified"
version = "0.1.0"
description = "Machine-learning environment with GPU-enabled PyTorch & TensorFlow"
readme = "README.md"
requires-python = ">=3.11,<3.12"

dependencies = [
  # GPU Frameworks
  "torch>=2.7.1",
  "torchvision>=0.13.1",
  "torchaudio>=2.7.1",
  "tensorflow>=2.19.0,<2.20.0",
  "tensorflow-probability>=0.25.0",

  # Privacy & Vector Search
  "opacus>=1.0.0",
  "faiss-gpu-cu12>=1.8.0.2",

  # Core ML & Data Libraries
  "xgboost>=1.7.0",
  "scikit-learn>=1.2.0",
  "numba>=0.56.4",
  "pandas>=2.0.1",
  "numpy>=1.25.0",
  "pyarrow>=12.0.0",
  "scipy>=1.10.0",
  "yfinance>=0.2.26",
  "gitpython>=3.1.30",
  "duckdb>=0.8.1",
  "shap>=0.42.1",
  "tqdm>=4.66.1",

  # Visualization & App
  "plotly>=5.15.0",
  "dash>=2.10.1",
  "dash-bootstrap-components>=1.4.2",
  "matplotlib>=3.7.1",
  "seaborn>=0.13.2",

  # Jupyter & Dev Tools
  "ipykernel>=6.23.0",
  "jupyter>=1.0.0",
]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
torch        = { index = "pytorch-cu118" }
torchvision  = { index = "pytorch-cu118" }
torchaudio   = { index = "pytorch-cu118" }
